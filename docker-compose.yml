services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: laravel-app
        restart: unless-stopped
        working_dir: /var/www/html
        ports:
            - "8000:8000"
        volumes:
            - .:/var/www/html
        depends_on:
            db:
                condition: service_healthy
            redis:
                condition: service_healthy
            mailpit:
                condition: service_started
            meilisearch:
                condition: service_started
        environment:
            APP_ENV: local
            APP_DEBUG: "true"
            APP_URL: http://localhost:8080

            DB_CONNECTION: pgsql
            DB_HOST: db
            DB_PORT: 5432
            DB_DATABASE: laravel
            DB_USERNAME: laravel
            DB_PASSWORD: secret

            REDIS_HOST: redis
            REDIS_PORT: 6379
            QUEUE_CONNECTION: redis
            REDIS_CLIENT: phpredis
            CACHE_STORE: redis

            MAIL_MAILER: smtp
            MAIL_HOST: mailpit
            MAIL_PORT: 1025
            MAIL_USERNAME: ""
            MAIL_PASSWORD: ""
            MAIL_ENCRYPTION: ""
            MAIL_FROM_ADDRESS: hello@example.com
            MAIL_FROM_NAME: Laravel

            SCOUT_DRIVER: meilisearch
            SCOUT_QUEUE: true
            MEILISEARCH_HOST: http://meilisearch:7700
            MEILISEARCH_KEY: masterKey

            LOG_CHANNEL: stack
            LOG_STACK: single
            LOG_DEPRECATIONS_CHANNEL: null
            LOG_LEVEL: debug

        networks:
            - laravel-network

        command: >
            sh -c "
                php artisan migrate:refresh --force &&
                php artisan import:dummyjson &&
                php artisan posts:multiply 400 &&
                php artisan scout:import Post &&
                php artisan serve --host=0.0.0.0 --port=8000
            "

    queue-worker:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: laravel-queue-worker
        restart: unless-stopped
        working_dir: /var/www/html
        volumes:
            - .:/var/www/html
        depends_on:
            db:
                condition: service_healthy
            redis:
                condition: service_healthy
            mailpit:
                condition: service_started
        environment:
            APP_ENV: local
            APP_DEBUG: "true"
            APP_URL: http://localhost:8080

            DB_CONNECTION: pgsql
            DB_HOST: db
            DB_PORT: 5432
            DB_DATABASE: laravel
            DB_USERNAME: laravel
            DB_PASSWORD: secret

            REDIS_HOST: redis
            REDIS_PORT: 6379
            QUEUE_CONNECTION: redis
            REDIS_CLIENT: phpredis
            CACHE_STORE: redis

            MAIL_MAILER: smtp
            MAIL_HOST: mailpit
            MAIL_PORT: 1025
            MAIL_USERNAME: ""
            MAIL_PASSWORD: ""
            MAIL_ENCRYPTION: ""
            MAIL_FROM_ADDRESS: hello@example.com
            MAIL_FROM_NAME: Laravel

            SCOUT_DRIVER: meilisearch
            SCOUT_QUEUE: true
            MEILISEARCH_HOST: http://meilisearch:7700
            MEILISEARCH_KEY: masterKey

        networks:
            - laravel-network

        command: php artisan queue:work redis --verbose --tries=3

    db:
        image: postgres:latest
        container_name: laravel-db
        restart: unless-stopped
        environment:
            POSTGRES_DB: laravel
            POSTGRES_USER: laravel
            POSTGRES_PASSWORD: secret
        ports:
            - "5432:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data
        networks:
            - laravel-network
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U laravel -d laravel"]
            interval: 5s
            timeout: 5s
            retries: 10

    redis:
        image: redis:alpine
        container_name: laravel-redis
        restart: unless-stopped
        command: redis-server --appendonly yes
        ports:
            - "6379:6379"
        volumes:
            - redis_data:/data
        networks:
            - laravel-network
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 3s
            retries: 10

    mailpit:
        image: axllent/mailpit:latest
        container_name: laravel-mailpit
        restart: unless-stopped
        ports:
            - "8025:8025"
            - "1025:1025"
        networks:
            - laravel-network

    meilisearch:
        image: getmeili/meilisearch:latest
        container_name: laravel-meilisearch
        restart: unless-stopped
        environment:
            MEILI_ENV: development
        ports:
            - "7700:7700"
        volumes:
            - meilisearch_data:/meili_data
        networks:
            - laravel-network

networks:
    laravel-network:
        driver: bridge

volumes:
    postgres_data:
    redis_data:
    meilisearch_data:
