name: ci-cd

on:
  pull_request:
  push:
    branches:
      - qc
      - main
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

env:
  COMPOSE_PROJECT_NAME: laravel-ci
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  pint:
    name: Pint
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/qc'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, pdo_pgsql, redis
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run Pint
        run: vendor/bin/pint --test

  larastan:
    name: Larastan
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/qc'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, pdo_pgsql, redis
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run Larastan
        run: vendor/bin/phpstan analyse

  feature-tests:
    name: Feature Tests
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/qc'
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: laravel
          POSTGRES_USER: laravel
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U laravel -d laravel"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      APP_ENV: testing
      APP_DEBUG: true
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=

      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: laravel
      DB_USERNAME: laravel
      DB_PASSWORD: secret

      CACHE_STORE: redis
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379

      QUEUE_CONNECTION: sync

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, pdo_pgsql, redis
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate --force

      - name: Run migrations
        run: php artisan migrate:fresh --force

      - name: Run feature tests
        run: php artisan test --testsuite=Feature

  acceptance:
    name: Acceptance Test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create CI environment
        run: |
          cp .env.example .env

          sed -i "s/^APP_ENV=.*/APP_ENV=local/" .env
          sed -i "s/^APP_DEBUG=.*/APP_DEBUG=true/" .env
          sed -i "s|^APP_KEY=.*|APP_KEY=$(openssl rand -base64 32 | tr -d '\\n')|" .env

          sed -i "s/^DB_CONNECTION=.*/DB_CONNECTION=pgsql/" .env
          sed -i "s/^DB_HOST=.*/DB_HOST=db/" .env
          sed -i "s/^DB_PORT=.*/DB_PORT=5432/" .env
          sed -i "s/^DB_DATABASE=.*/DB_DATABASE=laravel/" .env
          sed -i "s/^DB_USERNAME=.*/DB_USERNAME=laravel/" .env
          sed -i "s/^DB_PASSWORD=.*/DB_PASSWORD=secret/" .env

          sed -i "s/^REDIS_HOST=.*/REDIS_HOST=redis/" .env
          sed -i "s/^REDIS_PORT=.*/REDIS_PORT=6379/" .env

          # Scout/Meilisearch: php -S subprocess does NOT inherit the
          # container environment (ServeCommand whitelists env vars when
          # a .env file exists), so the web server reads these from .env.
          # .env.example has no SCOUT_* keys, hence the append below.
          [[ -n "$(grep -E '^SCOUT_DRIVER=' .env)" ]] || echo 'SCOUT_DRIVER=meilisearch' >> .env
          [[ -n "$(grep -E '^SCOUT_QUEUE=' .env)" ]] || echo 'SCOUT_QUEUE=true' >> .env
          [[ -n "$(grep -E '^MEILISEARCH_HOST=' .env)" ]] || echo 'MEILISEARCH_HOST=http://meilisearch:7700' >> .env
          [[ -n "$(grep -E '^MEILISEARCH_KEY=' .env)" ]] || echo 'MEILISEARCH_KEY=masterKey' >> .env

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, pdo_pgsql, redis
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Start Docker Compose
        run: docker compose up -d --build

      - name: Wait for application
        shell: bash
        run: |
          for i in {1..150}; do
            if curl -fsS http://localhost:8000/api/ping >/dev/null 2>&1; then
              echo "Application is ready after ~$((i * 5))s"
              break
            fi

            state=$(docker compose ps --format '{{.State}}' app 2>/dev/null || echo "")
            if [ "$state" = "exited" ] || [ "$state" = "restarting" ] || [ "$state" = "dead" ]; then
              echo "Application container is in state '$state'. Aborting."
              docker compose logs app --no-color || true
              exit 1
            fi

            echo "Waiting for application... ($i/150, state=$state)"
            sleep 5
          done

          curl -fsS http://localhost:8000/api/ping

      - name: Run acceptance endpoints
        shell: bash
        run: |
          set -e

          mkdir -p /tmp/acceptance

          request() {
            local name="$1"
            local method="$2"
            local url="$3"

            start=$(date +%s%3N)

            response=$(curl -sS \
              --max-time 120 \
              -o "/tmp/acceptance/${name}.json" \
              -w "%{http_code}" \
              -X "$method" \
              "http://localhost:8000${url}")

            end=$(date +%s%3N)
            duration=$((end - start))

            echo "${name}|${method}|${url}|${response}|${duration}" \
              >> /tmp/acceptance/results.txt

            if [ "$response" -lt 200 ] || [ "$response" -ge 300 ]; then
              echo "Endpoint ${name} failed with HTTP ${response}"
              return 1
            fi
          }

          request "ping" GET "/api/ping"
          request "posts-index" GET "/api/posts"
          request "posts-show" GET "/api/posts/1"
          request "search" GET "/api/search?q=history"
          request "stats-top-tags" GET "/api/stats/top-tags"

      - name: Write acceptance result to Job Summary
        if: always()
        shell: bash
        run: |
          echo "# Acceptance Test" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "## Dataset" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Database: PostgreSQL" >> "$GITHUB_STEP_SUMMARY"
          echo "- Cache: Redis" >> "$GITHUB_STEP_SUMMARY"
          echo "- Import: \`import:dummyjson\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Multiply: \`posts:multiply 400\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "## Endpoint Response Time" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Endpoint | Method | URL | HTTP | Response Time |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|---:|---:|" >> "$GITHUB_STEP_SUMMARY"

          if [ -f /tmp/acceptance/results.txt ]; then
            while IFS='|' read -r name method url status duration; do
              echo "| ${name} | ${method} | \`${url}\` | ${status} | ${duration} ms |" \
                >> "$GITHUB_STEP_SUMMARY"
            done < /tmp/acceptance/results.txt
          else
            echo "| - | - | - | FAILED | - |" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Docker Compose logs
        if: failure()
        run: docker compose logs --no-color

      - name: Stop Docker Compose
        if: always()
        run: docker compose down -v

  build:
    name: Build and Push Docker Image
    if: github.event_name == 'push' && (github.ref == 'refs/heads/qc' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    needs:
      - acceptance

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy:
    name: deploy
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs:
      - acceptance

    environment:
      name: production

    steps:
      - name: Simulate production deployment
        run: |
          echo "========================================"
          echo "Production deployment simulation"
          echo "========================================"
          echo "Tag       : ${{ github.ref_name }}"
          echo "Commit SHA: ${{ github.sha }}"
          echo "Image     : ${{ env.IMAGE_NAME }}:${{ github.sha }}"
          echo ""
          echo "Deployment would be executed here."
          echo "No real production server is modified."

      - name: Deployment summary
        run: |
          echo "# Production Deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Environment: production" >> "$GITHUB_STEP_SUMMARY"
          echo "- Tag: \`${{ github.ref_name }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Image: \`${{ env.IMAGE_NAME }}:${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Status: simulated" >> "$GITHUB_STEP_SUMMARY"
